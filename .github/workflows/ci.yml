name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  validate-theme:
    name: Validate Ghost theme package on Adlon
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","personal-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate theme metadata and archive
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          assert package.get('name') and package.get('engines', {}).get('ghost'), 'Ghost theme metadata is incomplete'
          archive = Path('terminal-eighty.zip')
          assert archive.is_file(), 'Packaged theme zip is missing'
          with ZipFile(archive) as zf:
              names = {Path(name).name for name in zf.namelist()}
              required = {'package.json', 'default.hbs', 'index.hbs', 'post.hbs'}
              missing = sorted(required - names)
              assert not missing, f'Theme archive is missing files: {missing}'
              assert zf.testzip() is None, 'Theme archive is corrupt'
          print('Validated Ghost metadata and theme archive')
          PY
